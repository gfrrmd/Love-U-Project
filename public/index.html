<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menfess 💌</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-inner">
        <div class="logo">💌 menfess</div>
        <div class="header-actions">
          <button class="btn-send" id="btnOpenForm">+ Kirim Menfess</button>
        </div>
      </div>
    </header>

    <!-- Search bar -->
    <div class="search-bar">
      <div class="search-inner">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Cari menfess untuk siapa..." />
        <button id="btnSearch">Cari</button>
      </div>
    </div>

    <!-- Feed -->
    <main class="feed" id="feed">
      <div class="feed-header">
        <span id="feedTitle">✨ Semua Menfess</span>
      </div>
      <div id="menfessList"></div>
      <div id="loadingFeed" class="loading-state">Memuat menfess...</div>
      <div id="emptyFeed" class="empty-state" style="display:none">Belum ada menfess 🥲</div>
    </main>
  </div>

  <!-- Modal Kirim Menfess -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h2>Kirim Menfess 💌</h2>
        <button class="modal-close" id="btnCloseForm">✕</button>
      </div>
      <form id="menfessForm">
        <div class="form-group">
          <label>Dari (opsional)</label>
          <input type="text" id="fSender" placeholder="Nama kamu / Anonim" maxlength="100" />
        </div>
        <div class="form-group">
          <label>Untuk <span class="required">*</span></label>
          <input type="text" id="fRecipient" placeholder="@username atau nama" maxlength="100" required />
        </div>
        <div class="form-group">
          <label>Pesan <span class="required">*</span></label>
          <textarea id="fMessage" placeholder="Tulis pesanmu di sini..." rows="4" maxlength="500" required></textarea>
          <span class="char-count" id="charCount">0/500</span>
        </div>

        <!-- Music search -->
        <div class="form-group">
          <label>🎵 Lampirkan Lagu (opsional)</label>
          <div class="music-search">
            <input type="text" id="musicSearch" placeholder="Cari judul / artis lagu..." />
            <button type="button" id="btnMusicSearch">Cari</button>
          </div>
          <div id="musicResults" class="music-results"></div>
          <div id="selectedTrack" class="selected-track" style="display:none"></div>
        </div>

        <div class="form-group">
          <label>Password Hapus (opsional)</label>
          <input type="password" id="fPassword" placeholder="Untuk hapus menfess nanti" maxlength="64" />
        </div>

        <div id="formError" class="form-error" style="display:none"></div>
        <button type="submit" class="btn-submit" id="btnSubmit">Kirim Menfess 💌</button>
      </form>
    </div>
  </div>

  <audio id="globalAudio" preload="none"></audio>
  <script src="app.js"></script>
</body>
</html>
